# Don't change the line below!
#! oxygen_storefront_id: 950295

name: Storefront 950295
on:
  - push
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true
      - name: Enable Corepack
        run: corepack enable
      - name: Install configured package manager
        run: corepack install
      - name: Set yarn version to 4.5.3
        run: yarn set version 4.5.3
      - name: Verify Yarn version
        run: yarn --version
      - name: Get yarn cache directory
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        with:
          path: '${{ steps.yarn-cache-dir-path.outputs.dir }}'
          key: "${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}"
          restore-keys: "${{ runner.os }}-yarn-\n"
      - name: Install dependencies
        id: install-dependencies
        run: yarn
      - name: Sync forum archive from S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
          FORUM_ARCHIVE_S3_URI: ${{ secrets.FORUM_ARCHIVE_S3_URI }}
        run: |
          if [ -z "$FORUM_ARCHIVE_S3_URI" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::Forum S3 sync skipped — set FORUM_ARCHIVE_S3_URI, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY"
            exit 0
          fi
          aws s3 sync "$FORUM_ARCHIVE_S3_URI" public/forum --delete
      - name: Build and Publish to Oxygen
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            FLAGS=""
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            FLAGS="--env-branch staging"
          else
            FLAGS="--preview"
          fi
          # Forum HTML is served at runtime from S3 CDN (forumArchive.server.ts), not bundled in dist.
          BUILD_CMD='yarn run build'
          if [ -f public/forum/index.html ]; then
            echo "Forum archive synced to public/forum (runtime CDN; not copied into dist)"
          else
            echo "::warning::public/forum missing — CI S3 sync may have failed"
          fi
          yarn run shopify hydrogen deploy --build-command "$BUILD_CMD" $FLAGS
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: '${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_950295 }}'
      - name: Print deployment log
        run: cat h2_deploy_log.json
